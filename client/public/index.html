<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Create your own cat-sino games. All games must die. Few are reborn as Tokens. 📈😼 📈😼" />
  <meta property="og:title" content="Catsino.Fun" />
  <meta property="og:description" content="Create your own cat-sino games. All games must die. Few are reborn as Tokens. 📈😼 📈😼" />

  <!-- Inline critical CSS -->
  <style>
    html, body, * {
      font-family: 'Source Code Pro', monospace !important; /* Monospace coding-style font */
      margin: 0;
    }
    .container { width: 100%; max-width: 1140px; margin: 0 auto; }
    button, .btn {
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
  </style>

  <!-- Preload Bootstrap CSS -->
  <link rel="preload" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" as="style" onload="this.rel='stylesheet'" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <noscript>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  </noscript>

  <!-- Preload Google Fonts - Source Code Pro -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;700&display=swap" as="style" onload="this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;700&display=swap">
  </noscript>

  <link rel="apple-touch-icon" href="game-logo-white.svg" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>Catsino.Fun</title>
  <base href="/" />
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Load Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Load Google Tag Manager with delay -->
  <script>
    setTimeout(() => {
      const script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id=UA-55401494-4';
      script.async = true;
      document.body.appendChild(script);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'UA-55401494-4');
    }, 3000);
  </script>

  <!-- Handle preload to stylesheet transition -->
  <script>
    (function(){
      var links = document.getElementsByTagName('link');
      for (var i = 0; i < links.length; i++) {
        if (links[i].rel === 'preload' && links[i].as === 'style') {
          links[i].rel = 'stylesheet';
        }
      }
    })();
  </script>
</body>
</html>
